name: Nightly Cron

on:
  schedule:
    - cron: 0 11 * * *

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        name: Create Deployment
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            await github.repos.createDeployment({
              ...context.repo,
              ref: context.ref.slice(11),
            });
